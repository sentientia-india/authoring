name: Moodle SCORM conformance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: moodle-scorm-conformance
  cancel-in-progress: false

jobs:
  moodle-45-lts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MOODLE_DOCKER_DB: pgsql
      MOODLE_DOCKER_PHP_VERSION: "8.3"
      MOODLE_DOCKER_BROWSER: chrome
      MOODLE_DOCKER_WWWROOT: ${{ github.workspace }}/.moodle-conformance/moodle
      MOODLE_DOCKER_WEB_PORT: "127.0.0.1:8000"
      MOODLE_DOCKER_COMMIT: 81a20665c2d2322469dc491c1f972ebde90ec014
      MOODLE_COMMIT: da7446c6c7b786f7f7588537f1cd48b3709c5439

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Build validation packages
        run: python scripts/build_scorm_conformance_fixtures.py --output .moodle-conformance/packages

      - name: Fetch pinned Moodle and test stack
        run: |
          mkdir -p .moodle-conformance
          git clone --filter=blob:none https://github.com/moodlehq/moodle-docker.git .moodle-conformance/moodle-docker
          git -C .moodle-conformance/moodle-docker checkout "$MOODLE_DOCKER_COMMIT"
          git clone --filter=blob:none https://github.com/moodle/moodle.git "$MOODLE_DOCKER_WWWROOT"
          git -C "$MOODLE_DOCKER_WWWROOT" checkout "$MOODLE_COMMIT"
          cp .moodle-conformance/moodle-docker/config.docker-template.php "$MOODLE_DOCKER_WWWROOT/config.php"
          cp .moodle-conformance/packages/*.zip "$MOODLE_DOCKER_WWWROOT/mod/scorm/tests/packages/"
          cp .github/moodle/course_mcp_scorm_acceptance.feature "$MOODLE_DOCKER_WWWROOT/mod/scorm/tests/behat/course_mcp_scorm_acceptance.feature"
          cp .github/moodle/behat_course_mcp.php "$MOODLE_DOCKER_WWWROOT/lib/tests/behat/behat_course_mcp.php"

      - name: Start pinned Moodle
        working-directory: .moodle-conformance/moodle-docker
        run: |
          bin/moodle-docker-compose up -d
          bin/moodle-docker-wait-for-db
          bin/moodle-docker-compose exec -T webserver php admin/cli/install_database.php \
            --agree-license \
            --fullname="Course MCP conformance" \
            --shortname="course_mcp" \
            --adminuser="admin" \
            --adminpass="Moodle-Conformance-Only-2026!" \
            --adminemail="conformance@example.invalid"

      - name: Verify Moodle health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/login/index.php >/dev/null; then
              echo "Moodle is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Moodle did not become ready" >&2
          exit 1

      - name: Validate generated packages before LMS import
        run: python scripts/build_scorm_conformance_fixtures.py --output .moodle-conformance/packages --verify-only

      - name: Initialize Moodle browser acceptance environment
        working-directory: .moodle-conformance/moodle-docker
        run: bin/moodle-docker-compose exec -T webserver php admin/tool/behat/cli/init.php

      - name: Import, run, relaunch, and verify both SCORM packages
        working-directory: .moodle-conformance/moodle-docker
        run: |
          mkdir -p ../evidence
          bin/moodle-docker-compose exec -T -u www-data webserver \
            php admin/tool/behat/cli/run.php --tags=@course_mcp_acceptance --format=progress --out=std
          printf '%s\n' \
            'Moodle Chrome acceptance passed for SCORM 1.2 and SCORM 2004.' \
            'Verified: initialize, score, completion, success, location, suspend data, interaction, commit, session time, terminate, and relaunch.' \
            > ../evidence/acceptance-summary.txt
          cp ../packages/conformance.json ../evidence/package-validation.json

      - name: Archive conformance inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moodle-scorm-conformance-inputs
          path: |
            .moodle-conformance/packages/*.zip
            .moodle-conformance/packages/conformance.json
            .moodle-conformance/evidence/*
          if-no-files-found: error
          retention-days: 30

      - name: Capture Moodle diagnostics
        if: always()
        working-directory: .moodle-conformance/moodle-docker
        run: bin/moodle-docker-compose logs --no-color > ../moodle-docker.log

      - name: Archive Moodle diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moodle-diagnostics
          path: .moodle-conformance/moodle-docker.log
          retention-days: 14

      - name: Stop Moodle
        if: always()
        working-directory: .moodle-conformance/moodle-docker
        run: bin/moodle-docker-compose down -v
