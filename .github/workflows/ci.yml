name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: course_mcp_ci
          POSTGRES_USER: course_mcp
          POSTGRES_PASSWORD: course_mcp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U course_mcp -d course_mcp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Security scan
        run: bandit -r src -q
      - name: Dependency audit
        run: pip-audit .
      - name: Migration contract
        env:
          DATABASE_URL: postgresql://course_mcp:course_mcp_ci@127.0.0.1:5432/course_mcp_ci
        run: |
          python scripts/apply_migrations.py
          python -m pytest tests/test_database_migrations.py tests/test_postgres_repositories.py tests/test_postgres_outbox.py tests/test_postgres_hosted_repository.py tests/test_postgres_billing.py -q
      - name: Docker build
        run: docker build -t samrat-course-mcp:ci .

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-main
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SERVER_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload repository to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_PATH"
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w 0)"
          tar --exclude='.git' --exclude='.env' -czf /tmp/samrat-course-mcp.tar.gz .
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH_B64='$DEPLOY_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH_B64" | base64 -d)"
          mkdir -p "$DEPLOY_PATH"
          find "$DEPLOY_PATH" -mindepth 1 ! -name '.env' -exec rm -rf {} +
          REMOTE
          scp -i ~/.ssh/deploy_key -P "${SERVER_PORT:-22}" /tmp/samrat-course-mcp.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/samrat-course-mcp.tar.gz"
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH_B64='$DEPLOY_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH_B64" | base64 -d)"
          tar -xzf /tmp/samrat-course-mcp.tar.gz -C "$DEPLOY_PATH"
          rm -f /tmp/samrat-course-mcp.tar.gz
          REMOTE

      - name: Restart Docker service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
          MCP_PORT: ${{ secrets.MCP_PORT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
        run: |
          test -n "$DEPLOY_PATH"
          test -n "$MCP_API_TOKEN"
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w 0)"
          MCP_API_TOKEN_B64="$(printf '%s' "$MCP_API_TOKEN" | base64 -w 0)"
          MCP_PORT_B64="$(printf '%s' "${MCP_PORT:-8777}" | base64 -w 0)"
          OPENROUTER_API_KEY_B64="$(printf '%s' "${OPENROUTER_API_KEY:-}" | base64 -w 0)"
          OPENROUTER_MODEL_B64="$(printf '%s' "${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}" | base64 -w 0)"
          OPENROUTER_BASE_URL_B64="$(printf '%s' "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}" | base64 -w 0)"
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH_B64='$DEPLOY_PATH_B64' MCP_API_TOKEN_B64='$MCP_API_TOKEN_B64' MCP_PORT_B64='$MCP_PORT_B64' OPENROUTER_API_KEY_B64='$OPENROUTER_API_KEY_B64' OPENROUTER_MODEL_B64='$OPENROUTER_MODEL_B64' OPENROUTER_BASE_URL_B64='$OPENROUTER_BASE_URL_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH_B64" | base64 -d)"
          MCP_API_TOKEN="$(printf '%s' "$MCP_API_TOKEN_B64" | base64 -d)"
          MCP_PORT="$(printf '%s' "$MCP_PORT_B64" | base64 -d)"
          OPENROUTER_API_KEY="$(printf '%s' "$OPENROUTER_API_KEY_B64" | base64 -d)"
          OPENROUTER_MODEL="$(printf '%s' "$OPENROUTER_MODEL_B64" | base64 -d)"
          OPENROUTER_BASE_URL="$(printf '%s' "$OPENROUTER_BASE_URL_B64" | base64 -d)"
          cd "$DEPLOY_PATH"
          umask 077
          mkdir -p secrets
          printf '%s\n' "$MCP_API_TOKEN" > secrets/mcp_api_token.txt
          printf '%s\n' "${OPENROUTER_API_KEY:-}" > secrets/openrouter_api_key.txt
          {
            printf 'ENVIRONMENT=production\n'
            printf 'MCP_HOST=0.0.0.0\n'
            printf 'MCP_PORT=%s\n' "$MCP_PORT"
            printf 'LOG_LEVEL=INFO\n'
            printf 'OUTPUT_DIR=/app/output\n'
            printf 'ALLOW_PUBLISH_TO_LMS=false\n'
            printf 'OPENROUTER_MODEL=%s\n' "${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}"
            printf 'OPENROUTER_BASE_URL=%s\n' "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
            printf 'OPENROUTER_TIMEOUT_SECONDS=60\n'
            printf 'OPENROUTER_MAX_RETRIES=2\n'
            printf 'OPENROUTER_RETRY_BACKOFF_SECONDS=0.5\n'
            printf 'OPENROUTER_APP_TITLE=Samrat Course MCP\n'
          } > .env
          docker compose up -d postgres redis
          docker compose build course-mcp scorm-editor
          docker compose run --rm course-mcp python /app/scripts/apply_migrations.py
          docker compose up -d course-mcp scorm-editor
          docker compose ps
          for attempt in $(seq 1 20); do
            if docker compose exec -T course-mcp python -m course_mcp_server.healthcheck; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker compose logs --tail=100 course-mcp
              exit 1
            fi
            sleep 3
          done
          for attempt in $(seq 1 20); do
            if docker compose exec -T scorm-editor python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/', timeout=3).read()"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker compose logs --tail=100 scorm-editor
              exit 1
            fi
            sleep 3
          done
          docker compose exec -T course-mcp python -m course_mcp_server.smoke
          REMOTE
