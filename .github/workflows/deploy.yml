name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SERVER_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
          MCP_PORT: ${{ secrets.MCP_PORT }}
        run: |
          test -n "$DEPLOY_PATH"
          test -n "$MCP_API_TOKEN"
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w 0)"
          MCP_API_TOKEN_B64="$(printf '%s' "$MCP_API_TOKEN" | base64 -w 0)"
          MCP_PORT_B64="$(printf '%s' "${MCP_PORT:-8777}" | base64 -w 0)"
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH_B64='$DEPLOY_PATH_B64' MCP_API_TOKEN_B64='$MCP_API_TOKEN_B64' MCP_PORT_B64='$MCP_PORT_B64' bash -s" <<'REMOTE'
          set -euo pipefail

          REPO_URL="https://github.com/ratsam93/course_pack_elearning.git"
          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH_B64" | base64 -d)"
          MCP_API_TOKEN="$(printf '%s' "$MCP_API_TOKEN_B64" | base64 -d)"
          MCP_PORT="$(printf '%s' "$MCP_PORT_B64" | base64 -d)"

          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            mkdir -p "$DEPLOY_PATH"
            git clone "$REPO_URL" "$DEPLOY_PATH"
          fi

          cd "$DEPLOY_PATH"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          umask 077
          {
            printf 'ENVIRONMENT=production\n'
            printf 'MCP_HOST=0.0.0.0\n'
            printf 'MCP_PORT=%s\n' "$MCP_PORT"
            printf 'MCP_API_TOKEN=%s\n' "$MCP_API_TOKEN"
            printf 'LOG_LEVEL=INFO\n'
            printf 'OUTPUT_DIR=/app/output\n'
            printf 'ALLOW_PUBLISH_TO_LMS=false\n'
          } > .env

          docker compose up -d --build
          docker compose ps
          REMOTE
