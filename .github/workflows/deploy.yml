name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  moodle-conformance:
    uses: ./.github/workflows/moodle-conformance.yml

  deploy:
    needs: moodle-conformance
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SERVER_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload repository to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_PATH"
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w 0)"
          RELEASE_ID="$GITHUB_SHA"
          tar --exclude='.git' --exclude='.env' -czf "/tmp/samrat-course-mcp-$RELEASE_ID.tar.gz" .
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH_B64='$DEPLOY_PATH_B64' RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH_B64" | base64 -d)"
          RELEASE_PATH="$DEPLOY_PATH/releases/$RELEASE_ID"
          mkdir -p "$RELEASE_PATH"
          REMOTE
          scp -i ~/.ssh/deploy_key -P "${SERVER_PORT:-22}" "/tmp/samrat-course-mcp-$RELEASE_ID.tar.gz" "$SERVER_USER@$SERVER_HOST:/tmp/samrat-course-mcp-$RELEASE_ID.tar.gz"
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH_B64='$DEPLOY_PATH_B64' RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH_B64" | base64 -d)"
          RELEASE_PATH="$DEPLOY_PATH/releases/$RELEASE_ID"
          tar -xzf "/tmp/samrat-course-mcp-$RELEASE_ID.tar.gz" -C "$RELEASE_PATH"
          rm -f "/tmp/samrat-course-mcp-$RELEASE_ID.tar.gz"
          REMOTE

      - name: Deploy on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
          MCP_PORT: ${{ secrets.MCP_PORT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_CATALOG: ${{ secrets.STRIPE_PRICE_CATALOG }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          test -n "$DEPLOY_PATH"
          test -n "$MCP_API_TOKEN"
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w 0)"
          MCP_API_TOKEN_B64="$(printf '%s' "$MCP_API_TOKEN" | base64 -w 0)"
          MCP_PORT_B64="$(printf '%s' "${MCP_PORT:-8777}" | base64 -w 0)"
          OPENROUTER_API_KEY_B64="$(printf '%s' "${OPENROUTER_API_KEY:-}" | base64 -w 0)"
          OPENROUTER_MODEL_B64="$(printf '%s' "${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}" | base64 -w 0)"
          OPENROUTER_BASE_URL_B64="$(printf '%s' "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}" | base64 -w 0)"
          STRIPE_SECRET_KEY_B64="$(printf '%s' "${STRIPE_SECRET_KEY:-}" | base64 -w 0)"
          STRIPE_WEBHOOK_SECRET_B64="$(printf '%s' "${STRIPE_WEBHOOK_SECRET:-}" | base64 -w 0)"
          STRIPE_PRICE_CATALOG_B64="$(printf '%s' "${STRIPE_PRICE_CATALOG:-{}}" | base64 -w 0)"
          PUBLIC_BASE_URL_B64="$(printf '%s' "${PUBLIC_BASE_URL:-}" | base64 -w 0)"
          RELEASE_ID="$GITHUB_SHA"
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH_B64='$DEPLOY_PATH_B64' RELEASE_ID='$RELEASE_ID' MCP_API_TOKEN_B64='$MCP_API_TOKEN_B64' MCP_PORT_B64='$MCP_PORT_B64' OPENROUTER_API_KEY_B64='$OPENROUTER_API_KEY_B64' OPENROUTER_MODEL_B64='$OPENROUTER_MODEL_B64' OPENROUTER_BASE_URL_B64='$OPENROUTER_BASE_URL_B64' STRIPE_SECRET_KEY_B64='$STRIPE_SECRET_KEY_B64' STRIPE_WEBHOOK_SECRET_B64='$STRIPE_WEBHOOK_SECRET_B64' STRIPE_PRICE_CATALOG_B64='$STRIPE_PRICE_CATALOG_B64' PUBLIC_BASE_URL_B64='$PUBLIC_BASE_URL_B64' bash -s" <<'REMOTE'
          set -euo pipefail

          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH_B64" | base64 -d)"
          MCP_API_TOKEN="$(printf '%s' "$MCP_API_TOKEN_B64" | base64 -d)"
          MCP_PORT="$(printf '%s' "$MCP_PORT_B64" | base64 -d)"
          OPENROUTER_API_KEY="$(printf '%s' "$OPENROUTER_API_KEY_B64" | base64 -d)"
          OPENROUTER_MODEL="$(printf '%s' "$OPENROUTER_MODEL_B64" | base64 -d)"
          OPENROUTER_BASE_URL="$(printf '%s' "$OPENROUTER_BASE_URL_B64" | base64 -d)"
          STRIPE_SECRET_KEY="$(printf '%s' "$STRIPE_SECRET_KEY_B64" | base64 -d)"
          STRIPE_WEBHOOK_SECRET="$(printf '%s' "$STRIPE_WEBHOOK_SECRET_B64" | base64 -d)"
          STRIPE_PRICE_CATALOG="$(printf '%s' "$STRIPE_PRICE_CATALOG_B64" | base64 -d)"
          PUBLIC_BASE_URL="$(printf '%s' "$PUBLIC_BASE_URL_B64" | base64 -d)"

          test -n "$RELEASE_ID"
          RELEASE_PATH="$DEPLOY_PATH/releases/$RELEASE_ID"
          PREVIOUS="$(readlink -f "$DEPLOY_PATH/current" 2>/dev/null || true)"
          if [ -z "$PREVIOUS" ] && [ -f "$DEPLOY_PATH/docker-compose.yml" ]; then PREVIOUS="$DEPLOY_PATH"; fi
          rollback() {
            status=$?
            trap - ERR
            if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
              cd "$PREVIOUS"
              export COMPOSE_PROJECT_NAME=samrat-course-mcp
              export RELEASE_ID="$(basename "$PREVIOUS")"
              docker compose up -d course-mcp scorm-editor outbox-worker analytics-worker
            fi
            exit "$status"
          }
          trap rollback ERR
          cd "$RELEASE_PATH"
          export COMPOSE_PROJECT_NAME=samrat-course-mcp
          export RELEASE_ID

          umask 077
          mkdir -p secrets
          mkdir -p "$DEPLOY_PATH/shared/secrets"
          if [ ! -s "$DEPLOY_PATH/shared/secrets/pii_encryption_key.txt" ]; then
            openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n' > "$DEPLOY_PATH/shared/secrets/pii_encryption_key.txt"
          fi
          printf '%s\n' "$MCP_API_TOKEN" > secrets/mcp_api_token.txt
          printf '%s\n' "${OPENROUTER_API_KEY:-}" > secrets/openrouter_api_key.txt
          printf '%s\n' "${STRIPE_SECRET_KEY:-}" > secrets/stripe_secret_key.txt
          printf '%s\n' "${STRIPE_WEBHOOK_SECRET:-}" > secrets/stripe_webhook_secret.txt
          cp "$DEPLOY_PATH/shared/secrets/pii_encryption_key.txt" secrets/pii_encryption_key.txt
          {
            printf 'ENVIRONMENT=production\n'
            printf 'MCP_HOST=0.0.0.0\n'
            printf 'MCP_PORT=%s\n' "$MCP_PORT"
            printf 'LOG_LEVEL=INFO\n'
            printf 'OUTPUT_DIR=/app/output\n'
            printf 'ALLOW_PUBLISH_TO_LMS=false\n'
            printf 'OPENROUTER_MODEL=%s\n' "${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}"
            printf 'OPENROUTER_BASE_URL=%s\n' "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
            printf 'OPENROUTER_TIMEOUT_SECONDS=60\n'
            printf 'OPENROUTER_MAX_RETRIES=2\n'
            printf 'OPENROUTER_RETRY_BACKOFF_SECONDS=0.5\n'
            printf 'OPENROUTER_APP_TITLE=Samrat Course MCP\n'
            printf 'STRIPE_PRICE_CATALOG=%s\n' "${STRIPE_PRICE_CATALOG:-{}}"
            printf 'PUBLIC_BASE_URL=%s\n' "${PUBLIC_BASE_URL:-}"
          } > .env

          docker compose up -d postgres redis
          docker compose build course-mcp scorm-editor
          docker compose run --rm course-mcp python /app/scripts/apply_migrations.py
          docker compose up -d course-mcp scorm-editor outbox-worker analytics-worker
          docker compose ps
          for attempt in $(seq 1 20); do
            if docker compose exec -T course-mcp python -m course_mcp_server.healthcheck; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker compose logs --tail=100 course-mcp
              exit 1
            fi
            sleep 3
          done
          for attempt in $(seq 1 20); do
            if docker compose exec -T scorm-editor python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/', timeout=3).read()"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker compose logs --tail=100 scorm-editor
              exit 1
            fi
            sleep 3
          done
          docker compose exec -T course-mcp python -m course_mcp_server.smoke
          docker compose exec -T course-mcp python /app/scripts/capacity_matrix.py \
            http://127.0.0.1:8777/health --max-error-rate 0 --max-p95 0.4
          ln -sfn "$RELEASE_PATH" "$DEPLOY_PATH/current"
          printf '{"release":"%s","deployed_at":"%s","previous":"%s"}\n' \
            "$RELEASE_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$PREVIOUS" > "$DEPLOY_PATH/deployment.json"
          trap - ERR
          REMOTE
