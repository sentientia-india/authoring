[project]
name = "samrat-course-mcp"
version = "0.1.0"
description = "Secure MCP server for e-learning course generation"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1",
  "pydantic>=2.7.0",
  "fastmcp>=2.0.0",
  "python-dotenv>=1.0.1",
  "redis>=5.0.0",
  "psycopg[binary]>=3.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "bandit>=1.7.8",
  "pip-audit>=2.7.0"
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
