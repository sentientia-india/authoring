[project]
name = "samrat-course-mcp"
version = "0.2.0"
description = "Secure MCP server for e-learning course generation"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1",
  "pydantic>=2.7.0",
  "fastmcp==3.4.2",
  "python-dotenv>=1.0.1",
  "redis>=5.0.0",
  "psycopg[binary]>=3.2.0",
  "pypdf>=5.0.0",
  "boto3>=1.35.0",
  "cryptography>=43.0.0"
]

[project.optional-dependencies]
ingestion = [
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0"
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "bandit>=1.7.8",
  "pip-audit>=2.7.0"
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["codex_next_step_pack", "output", "course_mcp_output"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
