<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCORM Editor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">SCORM editor</p>
      <h1>Course authoring workspace</h1>
    </div>
    <nav class="mode-tabs" aria-label="Editor mode">
      <button class="mode-tab active" type="button" data-mode="outline">Outline</button>
      <button class="mode-tab" type="button" data-mode="lesson">Lesson</button>
      <button class="mode-tab" type="button" data-mode="theme">Theme</button>
      <button class="mode-tab" type="button" data-mode="assessment">Assessment</button>
    </nav>
    <label class="upload">
      <input id="zip-input" type="file" accept=".zip,application/zip">
      <span>Select SCORM ZIP</span>
    </label>
  </header>
  <main class="layout">
    <section class="panel dropzone" id="dropzone">
      <strong>Drop a SCORM ZIP here</strong>
      <p>Import the package, edit the outline, then export a rebuilt ZIP.</p>
      <div id="import-status" class="status">No package loaded.</div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <strong>Outline</strong>
        <button id="export-btn" disabled>Export ZIP</button>
      </div>
      <div id="outline" class="tree"></div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <strong>Editor</strong>
        <span id="selection-label">Nothing selected</span>
      </div>
      <div id="editor"></div>
    </section>
    <section class="panel preview-panel">
      <div class="panel-head">
        <strong>Preview</strong>
        <div class="viewport-tabs" aria-label="Preview size">
          <button class="viewport-tab active" type="button" data-viewport="desktop">Desktop</button>
          <button class="viewport-tab" type="button" data-viewport="tablet">Tablet</button>
          <button class="viewport-tab" type="button" data-viewport="mobile">Mobile</button>
        </div>
      </div>
      <div id="preview" class="preview-frame"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
