services:
  course-mcp:
    build: .
    container_name: samrat-course-mcp
    env_file:
      - .env
    environment:
      MCP_API_TOKEN_FILE: /run/secrets/mcp_api_token
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    ports:
      - "127.0.0.1:8777:8777"
    networks:
      - course-mcp-net
    volumes:
      - course_mcp_output:/app/output
    secrets:
      - mcp_api_token
      - openrouter_api_key
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "course_mcp_server.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  course-mcp-net:
    driver: bridge

volumes:
  course_mcp_output:

secrets:
  mcp_api_token:
    file: ./secrets/mcp_api_token.txt
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt
