services:
  caddy:
    image: caddy:2.10-alpine
    container_name: samrat-course-mcp-caddy
    profiles: ["tls"]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - course-mcp-net
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/landing:/srv/apps/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - course-mcp
      - scorm-editor
    restart: unless-stopped
  course-mcp:
    build: .
    container_name: samrat-course-mcp
    env_file:
      - .env
    environment:
      MCP_API_TOKEN_FILE: /run/secrets/mcp_api_token
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      DATABASE_URL: postgresql://course_mcp:course_mcp@postgres:5432/course_mcp
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8777:8777"
    networks:
      - course-mcp-net
    depends_on:
      - postgres
      - redis
    volumes:
      - course_mcp_output:/app/output
    secrets:
      - mcp_api_token
      - openrouter_api_key
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "course_mcp_server.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scorm-editor:
    build:
      context: .
      dockerfile: Dockerfile.scorm-editor
    container_name: samrat-scorm-editor
    ports:
      - "8788:8788"
    networks:
      - course-mcp-net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10002:10002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: samrat-course-mcp-postgres
    environment:
      POSTGRES_DB: course_mcp
      POSTGRES_USER: course_mcp
      POSTGRES_PASSWORD: course_mcp
    networks:
      - course-mcp-net
    volumes:
      - course_mcp_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: samrat-course-mcp-redis
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - course-mcp-net
    volumes:
      - course_mcp_redis:/data
    restart: unless-stopped

networks:
  course-mcp-net:
    driver: bridge

volumes:
  course_mcp_output:
  course_mcp_postgres:
  course_mcp_redis:
  caddy_data:
  caddy_config:

secrets:
  mcp_api_token:
    file: ./secrets/mcp_api_token.txt
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt
