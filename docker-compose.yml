services:
  caddy:
    image: caddy:2.10-alpine
    container_name: samrat-course-mcp-caddy
    profiles: ["tls"]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - course-mcp-net
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/landing:/srv/apps/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - course-mcp
      - scorm-editor
    restart: unless-stopped
  course-mcp:
    build: .
    image: samrat-course-mcp:${RELEASE_ID:-local}
    container_name: samrat-course-mcp
    env_file:
      - .env
    environment:
      MCP_API_TOKEN_FILE: /run/secrets/mcp_api_token
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      PII_ENCRYPTION_KEY_FILE: /run/secrets/pii_encryption_key
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      EMAIL_WEBHOOK_SECRET_FILE: /run/secrets/email_webhook_secret
      DATABASE_URL: postgresql://course_mcp:course_mcp@postgres:5432/course_mcp
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-course-mcp}
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-course-mcp}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-course-mcp-development-only}
    ports:
      - "127.0.0.1:8777:8777"
    networks:
      - course-mcp-net
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - course_mcp_output:/app/output
    secrets:
      - mcp_api_token
      - openrouter_api_key
      - pii_encryption_key
      - stripe_secret_key
      - stripe_webhook_secret
      - smtp_password
      - email_webhook_secret
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "course_mcp_server.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scorm-editor:
    build:
      context: .
      dockerfile: Dockerfile.scorm-editor
    image: samrat-scorm-editor:${RELEASE_ID:-local}
    container_name: samrat-scorm-editor
    ports:
      - "8788:8788"
    networks:
      - course-mcp-net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10002:10002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  outbox-worker:
    build: .
    image: samrat-course-mcp:${RELEASE_ID:-local}
    command: ["python", "-m", "course_mcp_server.outbox_worker"]
    env_file:
      - .env
    environment:
      PII_ENCRYPTION_KEY_FILE: /run/secrets/pii_encryption_key
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      DATABASE_URL: postgresql://course_mcp:course_mcp@postgres:5432/course_mcp
      REDIS_URL: redis://redis:6379/0
    networks:
      - course-mcp-net
    depends_on:
      postgres: {condition: service_started}
    secrets:
      - pii_encryption_key
      - smtp_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    restart: unless-stopped

  analytics-worker:
    build: .
    image: samrat-course-mcp:${RELEASE_ID:-local}
    command: ["python", "-m", "course_mcp_server.analytics_worker"]
    env_file:
      - .env
    environment:
      PII_ENCRYPTION_KEY_FILE: /run/secrets/pii_encryption_key
      DATABASE_URL: postgresql://course_mcp:course_mcp@postgres:5432/course_mcp
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-course-mcp}
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-course-mcp}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-course-mcp-development-only}
    networks:
      - course-mcp-net
    depends_on:
      postgres: {condition: service_started}
      minio-init: {condition: service_completed_successfully}
    secrets:
      - pii_encryption_key
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: samrat-course-mcp-postgres
    environment:
      POSTGRES_DB: course_mcp
      POSTGRES_USER: course_mcp
      POSTGRES_PASSWORD: course_mcp
    networks:
      - course-mcp-net
    volumes:
      - course_mcp_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: samrat-course-mcp-redis
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - course-mcp-net
    volumes:
      - course_mcp_redis:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:-course-mcp}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:-course-mcp-development-only}
    networks:
      - course-mcp-net
    volumes:
      - course_mcp_objects:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    environment:
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-course-mcp}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-course-mcp}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-course-mcp-development-only}
    networks:
      - course-mcp-net
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$$OBJECT_STORE_ACCESS_KEY" "$$OBJECT_STORE_SECRET_KEY"; do sleep 2; done;
        mc mb --ignore-existing "local/$$OBJECT_STORE_BUCKET"

networks:
  course-mcp-net:
    driver: bridge

volumes:
  course_mcp_output:
  course_mcp_postgres:
  course_mcp_redis:
  course_mcp_objects:
  caddy_data:
  caddy_config:

secrets:
  mcp_api_token:
    file: ./secrets/mcp_api_token.txt
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt
  pii_encryption_key:
    file: ./secrets/pii_encryption_key.txt
  stripe_secret_key:
    file: ./secrets/stripe_secret_key.txt
  stripe_webhook_secret:
    file: ./secrets/stripe_webhook_secret.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
  email_webhook_secret:
    file: ./secrets/email_webhook_secret.txt
